name: full-tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

jobs:
  test:
    name: PHP ${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            php: 8.4
            laravel: 13.*
            stability: prefer-stable
            testbench: 11.*

          - os: ubuntu-latest
            php: 8.2
            laravel: 12.*
            stability: prefer-stable
            testbench: 10.*

          - os: ubuntu-latest
            php: 8.4
            laravel: 12.*
            stability: prefer-stable
            testbench: 10.*

          - os: ubuntu-latest
            php: 8.2
            laravel: 11.*
            stability: prefer-stable
            testbench: 9.*

          - os: windows-latest
            php: 8.2
            laravel: 12.*
            stability: prefer-stable
            testbench: 10.*

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Pin Laravel version
        shell: bash
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --${{ matrix.stability }} --prefer-dist

      - name: Run tests
        run: vendor/bin/pest --ci --parallel
