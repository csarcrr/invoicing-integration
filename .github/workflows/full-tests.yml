name: full-tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

jobs:
  test:
    name: PHP ${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: 8.5
            laravel: 13.*
            stability: prefer-stable
            testbench: 11.*
            dependencies: highest

          - os: ubuntu-latest
            php: 8.4
            laravel: 12.*
            stability: prefer-stable
            testbench: 10.*
            dependencies: highest

          - os: ubuntu-latest
            php: 8.2
            laravel: 11.*
            stability: prefer-stable
            testbench: ^9.3
            dependencies: lowest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo
          coverage: none

      - name: Pin Laravel version
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update

      - name: Allow Laravel 11 despite security advisories
        if: matrix.laravel == '11.*'
        run: composer config policy.advisories.block false

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --${{ matrix.stability }} --prefer-dist

      - name: Run tests
        run: vendor/bin/pest --ci --parallel
